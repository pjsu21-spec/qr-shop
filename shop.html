<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>다름달음 QR 행사몰</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}
button,input{font:inherit}
.app{max-width:680px;margin:0 auto;min-height:100vh;background:#fff;padding-bottom:100px}
.header{padding:28px 20px 24px;text-align:center;border-bottom:1px solid #eee;background:#fff}
.logo{font-size:24px;font-weight:900;letter-spacing:-1px}
.header h1{margin:12px 0 5px;font-size:25px;letter-spacing:-1px}
.header p{margin:0;color:#777;font-size:14px}
.banner{margin:16px;padding:13px 15px;border-radius:12px;background:#fff7d6;color:#725d00;font-size:13px;line-height:1.5}
.products{padding:0 16px}
.loading-msg{padding:60px 0;text-align:center;color:#999;font-size:14px}
.card{border:1px solid #e8e8e8;border-radius:16px;margin:12px 0;padding:14px;overflow:hidden}
.product-image{width:100%;aspect-ratio:1.5;border-radius:12px;background:linear-gradient(135deg,#f5f5f5,#e7e7e7);display:flex;align-items:center;justify-content:center;font-size:48px;overflow:hidden;position:relative}
.back-badge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:4px 9px;border-radius:999px;font-weight:700;pointer-events:none}
.lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:30;padding:24px}
.lightbox-img{max-width:100%;max-height:80vh;border-radius:8px;display:block;margin:0 auto}
.lightbox-close{position:absolute;top:-14px;right:-14px;width:34px;height:34px;border-radius:50%;border:0;background:#fff;font-size:18px}
.product-name{margin-top:13px;font-size:19px;font-weight:800;letter-spacing:-.5px}
.product-desc{margin-top:4px;font-size:13px;color:#777}
.price{display:flex;align-items:center;gap:8px;margin-top:10px}
.normal{text-decoration:line-through;color:#aaa;font-size:14px}
.sale{font-size:21px;font-weight:900}
.stock{margin-top:5px;color:#888;font-size:12px}
.action-row{display:flex;align-items:center;justify-content:space-between;margin-top:13px}
.qty{display:flex;align-items:center;border:1px solid #ddd;border-radius:10px;overflow:hidden}
.qty button{width:36px;height:36px;border:0;background:#fff;font-size:20px}
.qty button:disabled{opacity:.3}
.qty span{min-width:36px;text-align:center;font-weight:800}
.add{border:0;border-radius:10px;background:#111;color:#fff;padding:10px 18px;font-weight:800}
.add:disabled{opacity:.3}
.cart{margin:20px 16px 0;padding:18px;border-radius:16px;background:#f8f8f8}
.cart h2{font-size:18px;margin:0 0 10px}
.empty{padding:14px 0;color:#888;font-size:14px}
.cart-line{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #e6e6e6;font-size:14px}
.cart-line:last-child{border-bottom:0}
.cart-name{flex:1}
.summary{margin-top:13px;padding-top:13px;border-top:1px solid #ddd}
.summary-row{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:#555}
.summary-row.total{margin-top:7px;padding-top:11px;border-top:1px solid #ddd;color:#222;font-size:18px;font-weight:900}
.checkout{width:100%;margin-top:14px;border:0;border-radius:12px;background:#111;color:#fff;padding:15px;font-weight:900;font-size:16px}
.checkout:disabled{opacity:.35}
.footer{padding:24px 20px;text-align:center;color:#999;font-size:11px;line-height:1.6}
.legal{margin-top:10px;padding-top:10px;border-top:1px solid #eee;color:#aaa}
.legal a{color:#aaa;text-decoration:underline}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:20px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet h2{margin:0;font-size:20px}
.close{border:0;background:#eee;border-radius:50%;width:34px;height:34px}
.form-label{display:block;margin:14px 0 6px;font-size:13px;font-weight:800}
.input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;outline:none}
.input:focus{border-color:#111}
.address-row{display:flex;gap:8px}
.address-row .input{flex:1}
.address-search{border:0;border-radius:10px;background:#111;color:#fff;padding:0 14px;font-weight:800;white-space:nowrap}
.pay-methods{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pay-btn{border:0;border-radius:12px;padding:15px;font-weight:900;font-size:15px;width:100%}
.pay-btn:disabled{opacity:.5}
.test-note{margin-top:12px;padding:11px;border-radius:10px;background:#fff7d6;color:#725d00;font-size:12px;line-height:1.5}
.consent-row{display:flex;align-items:flex-start;gap:8px;margin-top:16px;font-size:13px;line-height:1.5;color:#333}
.consent-row input{margin-top:3px;flex-shrink:0}
.consent-row a{color:#666;text-decoration:underline;white-space:nowrap}
.complete{text-align:center;padding:35px 20px}
.complete-icon{font-size:50px}
.order-no{font-size:25px;font-weight:900;margin:12px 0}
.complete-box{margin:20px 0;padding:16px;background:#f7f7f7;border-radius:12px;text-align:left}
.primary{width:100%;border:0;border-radius:11px;background:#111;color:#fff;padding:14px;font-weight:900}
.secondary{width:100%;margin-top:9px;border:1px solid #ddd;border-radius:11px;background:#fff;padding:13px;font-weight:800}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 15px;border-radius:999px;font-size:13px;z-index:50;display:none}
.small{font-size:12px;color:#888}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">다름달음</div>
    <h1>박람회 특별 판매</h1>
    <p>QR로 바로 주문하고 받아보세요</p>
  </header>

  <div class="banner" id="banner" style="display:none"></div>

  <section class="products" id="products"><div class="loading-msg">상품을 불러오는 중...</div></section>

  <section class="cart">
    <h2>🛒 장바구니</h2>
    <div id="cartItems" class="empty">상품을 담아주세요.</div>
    <div class="summary">
      <div class="summary-row"><span>상품금액</span><strong id="productTotal">0원</strong></div>
      <div class="summary-row"><span>배송비</span><strong id="shipping">0원</strong></div>
      <div class="summary-row total"><span>총 결제금액</span><strong id="grandTotal">0원</strong></div>
    </div>
    <button id="checkout" class="checkout" disabled>주문정보 입력</button>
  </section>

  <div class="footer">
    다름달음 QR 행사몰<br>
    주문 관련 문의는 현장 직원에게 말씀해주세요.
    <!-- 아래 사업자정보는 admin.html의 "사업자정보" 탭에서 관리합니다. -->
    <div class="legal" id="legalInfo"></div>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
<script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
// ============================================================
// 설정 — Supabase 프로젝트 정보로 교체하세요 (설치_가이드.md 참고)
// ============================================================
const SUPABASE_URL = "https://dvbqfjjpshddkpcmzmyr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Y03Q631sspU7WA_oKYA3uA_bko0vVlZ";
const VERIFY_FN_URL = SUPABASE_URL + "/functions/v1/verify-payment";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const PAY_META = {
  CARD:     { label: "신용·체크카드", bg: "#111111", fg: "#ffffff" },
  KAKAOPAY: { label: "카카오페이",     bg: "#FEE500", fg: "#191600" },
  NAVERPAY: { label: "네이버페이",     bg: "#03C75A", fg: "#ffffff" },
  TOSSPAY:  { label: "토스페이",       bg: "#1B64DA", fg: "#ffffff" },
};

let PRODUCTS = [];
let SETTINGS = null;
let isPaying = false;
const cart = {};

const won = n => Number(n||0).toLocaleString("ko-KR") + "원";
function esc(s){
  return String(s??"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}

// ============================================================
// 데이터 로딩
// ============================================================
async function loadAll(){
  const [{data: products, error: pErr}, {data: settingsRow, error: sErr}] = await Promise.all([
    sb.from("qrshop_products").select("*").eq("is_active", true).order("display_order", {ascending:true}),
    sb.from("qrshop_settings").select("*").eq("id", 1).single()
  ]);
  if(pErr) console.error("상품 조회 오류:", pErr);
  if(sErr) console.error("설정 조회 오류:", sErr);
  PRODUCTS = products || [];
  SETTINGS = settingsRow || { shipping_base:0, shipping_free_threshold:0, payment_methods:{}, banner_message:"", legal_info:{}, payment_mode:"ONLINE" };
  renderBanner();
  renderProducts();
  renderCart();
  renderLegal();
}

function renderBanner(){
  const el = document.getElementById("banner");
  if(SETTINGS && SETTINGS.banner_message){
    el.style.display = "block";
    el.textContent = SETTINGS.banner_message;
  } else {
    el.style.display = "none";
  }
}

// ============================================================
// 사업자정보 / 약관·정책 (admin.html "사업자정보" 탭에서 관리)
// ============================================================
function renderLegal(){
  const el = document.getElementById("legalInfo");
  const L = (SETTINGS && SETTINGS.legal_info) || {};
  const bizNoDigits = (L.business_reg_no || "").replace(/[^0-9]/g, "");

  const links = [
    L.terms_url ? `<a href="${esc(L.terms_url)}" target="_blank">이용약관</a>` : "",
    L.privacy_url ? `<a href="${esc(L.privacy_url)}" target="_blank">개인정보처리방침</a>` : "",
    L.shipping_info ? `<a href="#" onclick="showLegalDoc('shipping');return false;">배송정보</a>` : "",
    L.return_info ? `<a href="#" onclick="showLegalDoc('return');return false;">교환/반품 안내</a>` : "",
    L.withdrawal_info ? `<a href="#" onclick="showLegalDoc('withdrawal');return false;">청약철회 안내</a>` : "",
    bizNoDigits ? `<a href="http://www.ftc.go.kr/bizCommPop.do?wrkr_no=${bizNoDigits}" target="_blank">사업자정보확인</a>` : "",
  ].filter(Boolean).join(" · ");

  if(!L.company_name && !L.business_reg_no){ el.innerHTML = ""; return; }

  el.innerHTML = `
    상호명 ${esc(L.company_name||"")} ${L.ceo_name?`· 대표 ${esc(L.ceo_name)}`:""}<br>
    ${L.business_reg_no?`사업자등록번호 ${esc(L.business_reg_no)}`:""} ${L.mail_order_no?`· 통신판매업 신고번호 ${esc(L.mail_order_no)}`:""}<br>
    ${esc(L.address||"")}<br>
    ${L.cs_phone?`고객센터 ${esc(L.cs_phone)}`:""} ${L.cs_email?`· ${esc(L.cs_email)}`:""}
    ${links ? `<div style="margin-top:8px">${links}</div>` : ""}
  `;
}

// 관리자가 설정을 비워두더라도 개인정보 동의 문구는 항상 뜨도록 기본값을 코드에 내장해둡니다.
// (전자상거래 등에서의 소비자보호에 관한 법률 시행령 제6조 기준 보유기간 포함)
const DEFAULT_PRIVACY_CONSENT_TEXT =
`1. 수집 항목
이름, 휴대폰번호, 배송주소(우편번호/주소/상세주소), 주문 및 결제 내역(주문상품, 결제금액, 결제수단, 결제일시)

2. 수집·이용 목적
상품 주문 접수 및 배송, 결제 확인 및 처리, 고객 문의·불만 처리, 부정거래 방지, 전자상거래법 등 관련 법령상 의무 이행

3. 보유 및 이용 기간
원칙적으로 수집·이용 목적이 달성되면 지체 없이 파기합니다. 다만 관계 법령에 따라 보존할 필요가 있는 경우 아래 기간 동안 보관합니다.
- 계약 또는 청약철회 등에 관한 기록: 5년 (전자상거래 등에서의 소비자보호에 관한 법률)
- 대금결제 및 재화 공급에 관한 기록: 5년 (전자상거래 등에서의 소비자보호에 관한 법률)
- 소비자 불만 또는 분쟁처리에 관한 기록: 3년 (전자상거래 등에서의 소비자보호에 관한 법률)

4. 동의 거부 권리 및 불이익
위 개인정보 수집·이용에 동의하지 않으실 권리가 있습니다. 다만 동의하지 않으실 경우 주문 접수 및 배송이 불가능하여 구매를 진행하실 수 없습니다.

5. 개인정보 처리위탁
당사는 이용자의 개인정보를 외부 업체에 함부로 제공하지 않으며, 서비스 제공을 위해 아래와 같이 처리를 위탁하고 있습니다. 위탁계약 시 개인정보가 안전하게 관리될 수 있도록 필요한 사항을 규정하고 있습니다.
- 수탁업체: Supabase, Inc. / 위탁업무: 주문·상품 데이터베이스 및 서버 호스팅
- 수탁업체: 포트원(주) 및 연동 결제대행사·카드사·간편결제사 / 위탁업무: 결제 처리 및 결제 확인
- 수탁업체: 제이엠로지스 / 위탁업무: 송장 발급 및 배송 포장(피킹)
- 수탁업체: CJ대한통운 / 위탁업무: 상품 배송

※ 위 업체 외 제3자에게 개인정보를 제공하지 않으며, 제공이 필요한 경우 별도로 동의를 받습니다.

※ 카드·간편결제 정보는 당사가 직접 저장하지 않으며, 결제대행사(포트원 및 제휴 PG·간편결제사)를 통해 안전하게 처리됩니다.`;

function showLegalDoc(type){
  const L = (SETTINGS && SETTINGS.legal_info) || {};
  const map = {
    shipping:         { title: "배송정보", body: L.shipping_info },
    return:           { title: "교환/반품 안내", body: L.return_info },
    withdrawal:       { title: "청약철회 관련 안내", body: L.withdrawal_info },
    privacy_consent:  { title: "개인정보 수집·이용 동의", body: L.privacy_consent_text || DEFAULT_PRIVACY_CONSENT_TEXT },
  };
  const doc = map[type];
  if(!doc || !doc.body) return;
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal">
      <div class="sheet">
        <div class="sheet-head"><h2>${esc(doc.title)}</h2><button class="close" onclick="closeModal()">×</button></div>
        <p class="small" style="white-space:pre-wrap;line-height:1.7;margin-top:12px;color:#444">${esc(doc.body)}</p>
      </div>
    </div>
  `;
}

function cartQtyFor(id){
  return Object.values(cart).filter(x=>x.id===id).reduce((s,x)=>s+x.quantity,0);
}

function renderProducts(){
  const box = document.getElementById("products");
  if(!PRODUCTS.length){
    box.innerHTML = '<div class="loading-msg">현재 준비된 상품이 없습니다.</div>';
    return;
  }
  box.innerHTML = PRODUCTS.map(p => `
    <article class="card">
      <div class="product-image" ${p.image_back_url ? `onclick="showBackImage('${p.id}')" style="cursor:pointer"` : ""}>
        ${p.image_url ? `<img src="${esc(p.image_url)}" style="width:100%;height:100%;object-fit:cover">` : esc(p.emoji||"📦")}
        ${p.image_back_url ? `<div class="back-badge">🔍 표시사항 보기</div>` : ""}
      </div>
      <div class="product-name">${esc(p.name)}</div>
      <div class="product-desc">${esc(p.description||"")}</div>
      ${p.options && p.options.length ? `<div style="margin-top:10px"><label class="small" style="display:block;margin-bottom:5px;font-weight:800">옵션 선택</label><select id="opt-${p.id}" class="input" onchange="optionChanged('${p.id}')">${p.options.map((o,i)=>`<option value="${i}">${esc((o.name?o.name+" ":"")+o.value)}${o.additionalPrice?` (+${won(o.additionalPrice)})`:""}</option>`).join("")}</select></div>` : ""}
      <div class="price">
        ${p.price_normal > p.price_sale ? `<span class="normal">${won(p.price_normal)}</span>` : ""}
        <span class="sale">${won(p.price_sale)}</span>
      </div>
      <div class="stock">${p.stock>0 ? `재고 ${p.stock}개` : `<b style="color:#c00">일시 품절</b>`}</div>
      <div class="action-row">
        <div class="qty">
          <button onclick="changeQty('${p.id}',-1)" ${p.stock<=0?"disabled":""}>−</button>
          <span id="qty-${p.id}">${cartQtyFor(p.id)}</span>
          <button onclick="changeQty('${p.id}',1)" ${p.stock<=0?"disabled":""}>+</button>
        </div>
        <button class="add" onclick="changeQty('${p.id}',1)" ${p.stock<=0?"disabled":""}>담기</button>
      </div>
    </article>
  `).join("");
}

function getSelectedOption(id){
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p || !p.options || !p.options.length) return null;
  const idx = Number(document.getElementById("opt-"+id)?.value || 0);
  return p.options[idx] || p.options[0] || null;
}
function optionChanged(){ toast("선택 옵션이 변경되었습니다."); }
function cartKey(id, option){
  return option ? id+"::"+option.value+"::"+(option.additionalPrice||0) : id;
}

function showBackImage(id){
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p || !p.image_back_url) return;
  document.getElementById("modalRoot").innerHTML = `
    <div class="lightbox-overlay" onclick="closeModal()">
      <div style="position:relative" onclick="event.stopPropagation()">
        <button class="lightbox-close" onclick="closeModal()">×</button>
        <img src="${esc(p.image_back_url)}" class="lightbox-img">
      </div>
    </div>
  `;
}

function changeQty(id, delta){
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  const option = getSelectedOption(id);
  const key = cartKey(id, option);
  let q = (cart[key]?.quantity || 0) + delta;
  q = Math.max(0, Math.min(q, p.stock));
  if(q === 0) delete cart[key];
  else cart[key] = { id: p.id, quantity: q, option: option ? {...option} : null };
  const qtyEl = document.getElementById("qty-"+id);
  if(qtyEl) qtyEl.textContent = cartQtyFor(id);
  renderCart();
  if(delta>0) toast(p.name + (option?` · ${option.value}`:"") + "을(를) 담았습니다.");
}

function renderCart(){
  const entries = Object.entries(cart);
  const box = document.getElementById("cartItems");
  let productTotal = 0;

  if(!entries.length){
    box.className = "empty"; box.innerHTML = "상품을 담아주세요.";
  } else {
    box.className = "";
    box.innerHTML = entries.map(([key,line])=>{
      const p = PRODUCTS.find(x=>x.id===line.id);
      if(!p) return "";
      const unit = p.price_sale + (line.option?.additionalPrice||0);
      const sub = unit*line.quantity;
      productTotal += sub;
      return `<div class="cart-line">
        <div class="cart-name">
          ${esc(p.name)}
          ${line.option?`<div class="small">옵션: ${esc((line.option.name?line.option.name+" ":"")+line.option.value)}</div>`:""}
          <div class="small">수량 ${line.quantity} × ${won(unit)}</div>
        </div>
        <div style="text-align:right">
          <strong>${won(sub)}</strong>
          <div style="margin-top:5px"><button class="small" style="border:0;background:#eee;border-radius:6px;padding:3px 7px" onclick="removeCartLine('${encodeURIComponent(key)}')">삭제</button></div>
        </div>
      </div>`;
    }).join("");
  }

  const base = SETTINGS?.shipping_base ?? 0;
  const freeThreshold = SETTINGS?.shipping_free_threshold ?? 0;
  const shipping = productTotal===0 ? 0 : (productTotal>=freeThreshold ? 0 : base);
  const total = productTotal + shipping;
  document.getElementById("productTotal").textContent = won(productTotal);
  document.getElementById("shipping").textContent = (shipping===0 && productTotal>0) ? "무료" : won(shipping);
  document.getElementById("grandTotal").textContent = won(total);
  document.getElementById("checkout").disabled = !entries.length;
}

function removeCartLine(encodedKey){
  delete cart[decodeURIComponent(encodedKey)];
  renderCart();
  toast("장바구니에서 삭제했습니다.");
}

document.getElementById("checkout").addEventListener("click", openCheckout);

// ============================================================
// 주문/결제
// ============================================================

    <div class="modal">
      <div class="sheet">

        </div>

        <input id="customerName" class="input" placeholder="홍길동">

        <label class="form-label">휴대폰 번호 *</label>
        <input id="customerPhone" class="input" placeholder="010-1234-5678" inputmode="tel">

        <label class="form-label">주소 *</label>
        <div class="address-row">

        <input id="deliveryRequest" class="input" placeholder="예: 부재 시 경비실에 맡겨주세요">

        <label class="consent-row">
          <input type="checkbox" id="privacyConsent">
          <span>주문 처리를 위한 개인정보 수집·이용에 동의합니다. (필수)
            <a href="#" onclick="showLegalDoc('privacy_consent');return false;">자세히 보기</a>
          </span>
        </label>

        ${
          (SETTINGS && SETTINGS.payment_mode === "ONSITE")
          ? `<div class="test-note">지금은 <b>현장결제</b> 운영 중입니다. 주문만 먼저 접수하시고, 결제는 부스 직원에게 안내받아 진행해주세요.</div>
             <button class="checkout" style="margin-top:10px" onclick="submitOnsiteOrder()">주문 접수하기</button>`
          : `<label class="form-label">결제 수단 *</label>
             ${
               availableMethods.length
               ? `<div class="pay-methods">${availableMethods.map(m => `<button class="pay-btn" style="background:${PAY_META[m].bg};color:${PAY_META[m].fg}" onclick="startPayment('${m}')">${PAY_META[m].label}</button>`).join("")}</div>`
               : `<div class="test-note">아직 이용 가능한 결제 수단이 없습니다. 관리자에게 문의해주세요.</div>`
             }`
        }
        <div id="payStatus"></div>
      </div>
    </div>
  `;
}

function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }

function openAddressSearch(){
  if(typeof daum === "undefined" || !daum.Postcode){
    alert("주소 검색 서비스를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.");
    return;
  }
  new daum.Postcode({
    oncomplete: function(data){
      let extra = "";
      if(data.userSelectedType === "R"){
        extra = data.bname && /[동|로|가]$/g.test(data.bname) ? data.bname : "";
        if(data.buildingName && data.apartment === "Y") extra += (extra ? ", " : "") + data.buildingName;
      } else {
        extra = data.jibunAddress || "";
      }
      document.getElementById("postcode").value = data.zonecode || "";
      document.getElementById("address").value = data.roadAddress || data.jibunAddress || "";
      document.getElementById("addressExtra").value = extra;
      document.getElementById("addressDetail").focus();
    }
  }).open();
}

function buildOrderName(items){
  if(!items.length) return "다름달음 주문";
  return items.length>1 ? `${items[0].name} 외 ${items.length-1}건` : items[0].name;
}
function buildRedirectUrl(orderId){
  return location.origin + location.pathname + "?orderId=" + orderId;
}
function setPayStatus(msg){
  const el = document.getElementById("payStatus");
  if(el) el.innerHTML = msg ? `<div class="test-note">${esc(msg)}</div>` : "";
}
// 010-1234-5678 형태로 자동 정리 (엑셀에서 앞자리 0이 사라지는 문제도 예방)
function formatPhoneNumber(raw){
  const digits = String(raw||"").replace(/[^0-9]/g, "");
  if(digits.length === 11) return digits.replace(/(\d{3})(\d{4})(\d{4})/, "$1-$2-$3");
  if(digits.length === 10){
    if(digits.startsWith("02")) return digits.replace(/(\d{2})(\d{4})(\d{4})/, "$1-$2-$3");
    return digits.replace(/(\d{3})(\d{3})(\d{4})/, "$1-$2-$3");
  }
  return raw; // 형식이 애매하면(국제번호 등) 입력값을 그대로 둠
}

function makeOrderNumber(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  const random = Math.floor(Math.random()*9000)+1000;
  return `DDM-${y}${m}${day}-${random}`;
}

async function createPendingOrder(method){
  const name = document.getElementById("customerName").value.trim();
  const phone = formatPhoneNumber(document.getElementById("customerPhone").value.trim());
  const postcode = document.getElementById("postcode").value.trim();
  const address = document.getElementById("address").value.trim();
  const addressExtra = document.getElementById("addressExtra").value.trim();
  const addressDetail = document.getElementById("addressDetail").value.trim();
  const deliveryRequest = document.getElementById("deliveryRequest").value.trim();

  if(!name){ alert("받는 분 이름을 입력해주세요."); return null; }
  if(!phone){ alert("휴대폰 번호를 입력해주세요."); return null; }
  if(!address){ alert("주소를 입력해주세요."); return null; }
  if(!document.getElementById("privacyConsent").checked){ alert("개인정보 수집·이용에 동의해주세요."); return null; }

  const items = Object.values(cart).map(line=>{
    const p = PRODUCTS.find(x=>x.id===line.id);
    const unitPrice = p.price_sale + (line.option?.additionalPrice||0);
    return {
      product_id: p.id,
      name: p.name,
      option: line.option ? {...line.option} : null,
      unitPrice,
      quantity: line.quantity,
      subtotal: unitPrice*line.quantity
    };
  });
  if(!items.length){ alert("장바구니가 비어 있습니다."); return null; }

  const productTotal = items.reduce((s,x)=>s+x.subtotal,0);
  const base = SETTINGS?.shipping_base ?? 0;
  const freeThreshold = SETTINGS?.shipping_free_threshold ?? 0;
  const shipping = productTotal>=freeThreshold ? 0 : base;
  const totalAmount = productTotal + shipping;

  const orderId = crypto.randomUUID();
  let orderNumber = makeOrderNumber();
  let insertError = null;

  for(let i=0; i<3; i++){
    const { error } = await sb.from("qrshop_orders").insert({
      id: orderId,
      order_number: orderNumber,
      customer_name: name,
      customer_phone: phone,
      postcode, address, address_extra: addressExtra, address_detail: addressDetail,
      delivery_request: deliveryRequest,
      product_total: productTotal,
      shipping_fee: shipping,
      total_amount: totalAmount,
      payment_method: method,
      payment_status: "PENDING"
    });
    if(!error){ insertError = null; break; }
    insertError = error;
    if(error.code === "23505"){ orderNumber = makeOrderNumber(); continue; }
    break;
  }
  if(insertError){
    console.error(insertError);
    alert("주문 생성에 실패했습니다. (오류: " + (insertError.message || insertError.code || "알 수 없음") + ")");
    return null;
  }

  const itemRows = items.map(it => ({
    order_id: orderId,
    product_id: it.product_id,
    product_name: it.name,
    option_name: it.option?.name || "",
    option_value: it.option?.value || "",
    option_additional_price: it.option?.additionalPrice || 0,
    unit_price: it.unitPrice,
    quantity: it.quantity,
    subtotal: it.subtotal
  }));
  const { error: itemsError } = await sb.from("qrshop_order_items").insert(itemRows);
  if(itemsError){
    console.error(itemsError);
    alert("주문 상품 정보 저장에 실패했습니다. (오류: " + (itemsError.message || itemsError.code || "알 수 없음") + ")");
    return null;
  }

  return { orderId, orderNumber, items, name, phone, productTotal, shipping, totalAmount };
}

async function startPayment(method){
  if(isPaying) return;
  isPaying = true;
  setPayStatus("주문을 생성하는 중...");

  const order = await createPendingOrder(method);
  if(!order){ isPaying = false; setPayStatus(""); return; }
  const { orderId, items, name, phone, totalAmount } = order;

  // 새로고침해도 결제 확인을 재시도할 수 있도록 orderId를 주소에 남겨둠
  history.replaceState({}, "", buildRedirectUrl(orderId));

  const methodConf = SETTINGS.payment_methods[method];
  const isCard = method === "CARD";
  setPayStatus("결제창을 여는 중...");

  try {
    const response = await PortOne.requestPayment({
      storeId: SETTINGS.portone_store_id,
      channelKey: methodConf.channel_key,
      paymentId: `qrshop-${orderId}`,
      orderName: buildOrderName(items),
      totalAmount,
      currency: "CURRENCY_KRW",
      payMethod: isCard ? "CARD" : "EASY_PAY",
      ...(isCard ? {} : { easyPay: { easyPayProvider: method } }),
      customer: { fullName: name, phoneNumber: phone },
      redirectUrl: buildRedirectUrl(orderId)
    });

    if(response && response.code){
      // 팝업/iframe 방식(주로 PC)에서 결제가 실패·취소된 경우.
      // 모바일 리다이렉트 방식은 페이지 자체가 이동했다가 돌아오므로 아래 init()에서 처리됩니다.
      isPaying = false; setPayStatus("");
      alert("결제가 완료되지 않았습니다: " + (response.message || "취소되었거나 실패했습니다."));
      return;
    }
    await finalizePayment(orderId);
  } catch(e){
    console.error(e);
    isPaying = false; setPayStatus("");
    alert("결제창을 여는 중 오류가 발생했습니다. 다시 시도해주세요.");
  }
}

async function submitOnsiteOrder(){
  if(isPaying) return;
  isPaying = true;
  setPayStatus("주문을 접수하는 중...");

  const order = await createPendingOrder("ONSITE");
  isPaying = false;
  if(!order){ setPayStatus(""); return; }

  for(const key of Object.keys(cart)) delete cart[key];
  showOnsiteComplete(order);
  loadAll();
}

function showOnsiteComplete(order){
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal">
      <div class="sheet">
        <div class="complete">
          <div class="complete-icon">🧾</div>
          <h2>주문이 접수되었습니다</h2>
          <div class="order-no">${esc(order.orderNumber)}</div>
          <div class="test-note" style="text-align:left">
            아직 결제 전입니다. <b>이 화면을 부스 직원에게 보여주고 결제</b>를 진행해주세요.
          </div>
          <div class="complete-box">
            <div class="summary-row"><span>받는 분</span><strong>${esc(order.name)}</strong></div>
            <div class="summary-row"><span>상품금액</span><strong>${won(order.productTotal)}</strong></div>
            <div class="summary-row"><span>배송비</span><strong>${order.shipping===0?"무료":won(order.shipping)}</strong></div>
            <div class="summary-row total"><span>결제하실 금액</span><strong>${won(order.totalAmount)}</strong></div>
          </div>
          <button class="primary" onclick="location.href = location.pathname">확인</button>
        </div>
      </div>
    </div>
  `;
}

async function finalizePayment(orderId){
  setPayStatus("결제 확인 중...");
  try {
    const res = await fetch(VERIFY_FN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify({ orderId })
    });
    const result = await res.json();
    isPaying = false;
    if(result.ok){
      for(const key of Object.keys(cart)) delete cart[key];
      history.replaceState({}, "", location.pathname);
      showComplete(result.order);
      loadAll();
    } else {
      setPayStatus("");
      showPaymentFailed(result.error || "결제 확인에 실패했습니다.");
    }
  } catch(e){
    console.error(e);
    isPaying = false; setPayStatus("");
    showPaymentFailed("네트워크 오류로 결제 확인에 실패했습니다.");
  }
}

function showComplete(order){
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal">
      <div class="sheet">
        <div class="complete">
          <div class="complete-icon">✅</div>
          <h2>주문이 완료되었습니다</h2>
          <div class="order-no">${esc(order.order_number)}</div>
          <div class="complete-box">
            <div class="summary-row"><span>받는 분</span><strong>${esc(order.customer_name)}</strong></div>
            <div class="summary-row"><span>상품금액</span><strong>${won(order.product_total)}</strong></div>
            <div class="summary-row"><span>배송비</span><strong>${order.shipping_fee===0?"무료":won(order.shipping_fee)}</strong></div>
            <div class="summary-row total"><span>총 결제금액</span><strong>${won(order.total_amount)}</strong></div>
          </div>
          <p class="small">주문번호를 꼭 저장해주세요.</p>
          <button class="primary" onclick="location.href = location.pathname">확인</button>
        </div>
      </div>
    </div>
  `;
}

function showPaymentFailed(message){
  document.getElementById("modalRoot").innerHTML = `
    <div class="modal">
      <div class="sheet">
        <div class="complete">
          <div class="complete-icon">⚠️</div>
          <h2>결제를 확인하지 못했습니다</h2>
          <p class="small">${esc(message)}</p>
          <button class="primary" onclick="location.reload()">새로고침해서 다시 확인</button>
          <button class="secondary" onclick="closeModal()">닫기</button>
        </div>
      </div>
    </div>
  `;
}

function toast(message){
  const el = document.getElementById("toast");
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.style.display="none", 1300);
}

// ============================================================
// 초기화
// ============================================================
function subscribeRealtime(){
  sb.channel("qrshop-public-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "qrshop_products" }, () => loadAll())
    .on("postgres_changes", { event: "*", schema: "public", table: "qrshop_settings" }, () => loadAll())
    .subscribe();
}

(async function init(){
  const params = new URLSearchParams(location.search);
  const returningOrderId = params.get("orderId");

  await loadAll();

  if(returningOrderId){
    document.getElementById("modalRoot").innerHTML = `
      <div class="modal"><div class="sheet"><div class="complete">
        <div class="complete-icon">⏳</div><h2>결제 확인 중...</h2>
        <p class="small">잠시만 기다려주세요.</p>
      </div></div></div>`;
    await finalizePayment(returningOrderId);
  }

  subscribeRealtime();
})();
</script>
