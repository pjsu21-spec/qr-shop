<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>다름달음 관리자 - QR 행사몰</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}
button,input,select,textarea{font:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 80px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px 0 16px}
.topbar .title{font-size:20px;font-weight:900;letter-spacing:-.5px}
.logout-btn{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:800}
.security-note{margin:0;padding:12px 14px;border-radius:12px;background:#fff7d6;color:#725d00;font-size:12px;line-height:1.6}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{flex:1;border:1px solid #ddd;background:#fff;padding:11px;border-radius:10px;font-weight:800;font-size:13px}
.tab.active{background:#111;color:#fff;border-color:#111}
.card{border:1px solid #e5e5e5;border-radius:14px;padding:16px;margin:12px 0;background:#fff}
.card h3{margin:0 0 12px;font-size:16px}
.label{display:block;font-size:12px;font-weight:800;margin:10px 0 5px;color:#444}
.field{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions{display:flex;gap:7px;margin-top:14px}
.actions button{flex:1;border:0;border-radius:9px;padding:11px;font-weight:800}
.black-btn{background:#111;color:#fff}
.gray-btn{background:#eee;color:#222}
.red-btn{background:#ffe7e7;color:#900}
.admin-image{width:100%;max-height:170px;object-fit:cover;border-radius:10px;margin-top:8px}
.option-row{display:grid;grid-template-columns:1fr 1fr 90px 34px;gap:6px;margin-top:7px}
.option-row input{min-width:0;padding:9px;border:1px solid #ddd;border-radius:8px}
.option-row button{border:0;border-radius:8px;background:#ffe7e7}
.small{font-size:12px;color:#888}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800}
.pill-paid{background:#e6f7ec;color:#0a7a3d}
.pill-pending{background:#fff3d6;color:#8a6100}
.pill-failed{background:#fde7e7;color:#a10000}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 15px;border-radius:999px;font-size:13px;z-index:50;display:none}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{width:min(360px,100%);background:#fff;border:1px solid #eee;border-radius:16px;padding:28px}
.login-card h1{font-size:19px;margin:0 0 18px;text-align:center}
.err{color:#c00;font-size:13px;margin-top:8px;min-height:16px}
.orders-toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.orders-toolbar select,.orders-toolbar button{padding:9px 12px;border-radius:9px;border:1px solid #ddd;background:#fff;font-weight:700;font-size:13px}
.order-items{margin:10px 0;padding:10px;background:#fafafa;border-radius:8px;font-size:13px}
.order-item-line{display:flex;justify-content:space-between;padding:3px 0}
</style>
</head>
<body>
<div id="app"><p class="small" style="text-align:center;padding:60px 0">불러오는 중...</p></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ============================================================
// 설정 — shop.html과 동일한 Supabase 프로젝트 정보로 교체하세요
// ============================================================
const SUPABASE_URL = "https://dvbqfjjpshddkpcmzmyr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Y03Q631sspU7WA_oKYA3uA_bko0vVlZ";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const PAY_META = {
  CARD:     { label: "신용·체크카드" },
  KAKAOPAY: { label: "카카오페이" },
  NAVERPAY: { label: "네이버페이" },
  TOSSPAY:  { label: "토스페이" },
};
const TABS = [
  { id: "products", label: "상품 관리" },
  { id: "settings", label: "결제·배송 설정" },
  { id: "orders",   label: "주문 내역" },
];

let PRODUCTS = [];
let SETTINGS = null;
let ORDERS = [];
let currentTab = "products";
let orderFilter = "ALL";

const won = n => Number(n||0).toLocaleString("ko-KR") + "원";
function esc(s){
  return String(s??"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}
function escAttr(s){ return esc(s); }
function toast(message){
  const el = document.getElementById("toast");
  el.textContent = message;
  el.style.display = "block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.style.display="none", 1400);
}

// ============================================================
// 인증
// ============================================================
function showLogin(){
  document.getElementById("app").innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <h1>🍅 다름달음 관리자 로그인</h1>
        <label class="label">이메일</label>
        <input id="loginEmail" class="field" type="email" placeholder="admin@example.com">
        <label class="label">비밀번호</label>
        <input id="loginPassword" class="field" type="password" placeholder="••••••••">
        <div id="loginError" class="err"></div>
        <button class="black-btn" style="width:100%;border:0;border-radius:10px;padding:12px;font-weight:800;margin-top:6px" onclick="login()">로그인</button>
        <p class="small" style="margin-top:14px;text-align:center">계정은 Supabase 대시보드에서 미리 생성해둔 것만 사용할 수 있습니다.</p>
      </div>
    </div>
  `;
  document.getElementById("loginPassword").addEventListener("keydown", e => { if(e.key==="Enter") login(); });
}

async function login(){
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errEl = document.getElementById("loginError");
  errEl.textContent = "";
  if(!email || !password){ errEl.textContent = "이메일과 비밀번호를 입력하세요."; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error) errEl.textContent = "로그인 실패: " + error.message;
}

async function logout(){
  await sb.auth.signOut();
}

sb.auth.onAuthStateChange((_event, session) => {
  if(session) showDashboard(); else showLogin();
});

// ============================================================
// 대시보드 뼈대 / 탭 전환
// ============================================================
function renderDashboardShell(){
  document.getElementById("app").innerHTML = `
    <div class="wrap">
      <div class="topbar">
        <div class="title">🍅 다름달음 관리자</div>
        <button class="logout-btn" onclick="logout()">로그아웃</button>
      </div>
      <div class="tabs">
        ${TABS.map(t => `<button class="tab ${currentTab===t.id?"active":""}" onclick="setTab('${t.id}')">${t.label}</button>`).join("")}
      </div>
      <div id="tabContent"><p class="small">불러오는 중...</p></div>
    </div>
  `;
}

async function setTab(tab){
  currentTab = tab;
  renderDashboardShell();
  if(tab === "products") renderProductsTab();
  else if(tab === "settings") renderSettingsTab();
  else if(tab === "orders") await loadOrders();
}

async function showDashboard(){
  renderDashboardShell();
  await Promise.all([loadProducts(), loadSettings()]);
  renderProductsTab();
}

// ============================================================
// 상품 관리
// ============================================================
async function loadProducts(){
  const { data, error } = await sb.from("qrshop_products").select("*").order("display_order", {ascending:true});
  if(error){ console.error(error); toast("상품 조회 실패: " + error.message); return; }
  PRODUCTS = data || [];
}

function renderProductsTab(){
  const content = document.getElementById("tabContent");
  content.innerHTML = `
    <button class="black-btn" style="width:100%;border:0;border-radius:10px;padding:12px;font-weight:800;margin-bottom:14px" onclick="editProductForm(null)">＋ 새 상품 추가</button>
    ${
      PRODUCTS.length
      ? PRODUCTS.map(p => `
        <div class="card">
          <div>
            <b>${esc(p.name)}</b> ${p.is_active ? "" : '<span class="pill pill-pending">숨김</span>'}
            <div class="small" style="margin-top:4px">판매가 ${won(p.price_sale)} · 재고 ${p.stock} · 정렬 ${p.display_order}</div>
          </div>
          ${p.image_url ? `<img class="admin-image" src="${esc(p.image_url)}">` : ""}
          <div class="actions">
            <button class="gray-btn" onclick="editProductForm('${p.id}')">수정</button>
            <button class="red-btn" onclick="deleteProduct('${p.id}')">삭제</button>
          </div>
        </div>
      `).join("")
      : '<p class="small">등록된 상품이 없습니다. 위 버튼으로 추가해보세요.</p>'
    }
  `;
}

function editProductForm(id){
  const p = id ? PRODUCTS.find(x=>x.id===id) : {
    id: null, name: "", description: "", price_normal: 0, price_sale: 0, stock: 0,
    display_order: PRODUCTS.length ? Math.max(...PRODUCTS.map(x=>x.display_order)) + 1 : 0,
    is_active: true, image_url: "", emoji: "📦", options: []
  };
  const isNew = !id;
  const content = document.getElementById("tabContent");
  content.innerHTML = `
    <div class="card">
      <h3>${isNew ? "새 상품" : "상품 수정"}</h3>
      <label class="label">상품명 *</label><input id="p_name" class="field" value="${escAttr(p.name)}">
      <label class="label">상품 설명</label><input id="p_desc" class="field" value="${escAttr(p.description||"")}">
      <div class="row2">
        <div><label class="label">정상가</label><input id="p_normal" type="number" class="field" value="${p.price_normal}"></div>
        <div><label class="label">판매가 *</label><input id="p_sale" type="number" class="field" value="${p.price_sale}"></div>
      </div>
      <div class="row2">
        <div><label class="label">재고</label><input id="p_stock" type="number" class="field" value="${p.stock}"></div>
        <div><label class="label">정렬순서(작을수록 먼저)</label><input id="p_order" type="number" class="field" value="${p.display_order}"></div>
      </div>
      <label class="label"><input type="checkbox" id="p_active" ${p.is_active?"checked":""}> 고객화면에 노출</label>

      <label class="label">상품 이미지 업로드</label>
      <input id="p_image_file" type="file" accept="image/*" class="field" onchange="onImageChange(this)">
      <label class="label">이미지 URL (업로드하면 자동 입력 · 직접 붙여넣기도 가능)</label>
      <input id="p_image_url" class="field" value="${escAttr(p.image_url||"")}">
      <div id="p_image_preview">${p.image_url ? `<img class="admin-image" src="${escAttr(p.image_url)}">` : ""}</div>
      <label class="label">이미지 없을 때 표시할 이모지</label>
      <input id="p_emoji" class="field" style="width:80px" value="${escAttr(p.emoji||"📦")}">

      <label class="label">옵션 (옵션명 / 옵션값 / 추가금액)</label>
      <div id="opts"></div>
      <button class="gray-btn" style="width:100%;border:0;border-radius:9px;padding:10px;font-weight:800;margin-top:8px" onclick="addOption()">＋ 옵션 추가</button>

      <div class="actions">
        <button class="gray-btn" onclick="renderProductsTab()">취소</button>
        <button class="black-btn" onclick="saveProduct('${id||""}', ${isNew})">저장</button>
      </div>
    </div>
  `;
  renderOptions(p.options || []);
}

function renderOptions(list){
  document.getElementById("opts").innerHTML = list.map(o => optionRow(o)).join("");
}
function optionRow(o={name:"",value:"",additionalPrice:0}){
  return `<div class="option-row" data-op>
    <input class="on" placeholder="옵션명" value="${escAttr(o.name)}">
    <input class="ov" placeholder="옵션값" value="${escAttr(o.value)}">
    <input class="ox" type="number" placeholder="+금액" value="${o.additionalPrice||0}">
    <button onclick="this.parentElement.remove()">×</button>
  </div>`;
}
function addOption(){ document.getElementById("opts").insertAdjacentHTML("beforeend", optionRow()); }

async function onImageChange(input){
  const file = input.files?.[0];
  if(!file) return;
  const preview = document.getElementById("p_image_preview");
  preview.innerHTML = '<p class="small">업로드 중...</p>';
  const url = await uploadImage(file);
  if(url){
    document.getElementById("p_image_url").value = url;
    preview.innerHTML = `<img class="admin-image" src="${esc(url)}">`;
  } else {
    preview.innerHTML = "";
  }
}

async function uploadImage(file){
  if(file.size > 3*1024*1024){ alert("이미지는 3MB 이하로 올려주세요."); return null; }
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g,"") || "jpg";
  const path = `products/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { error } = await sb.storage.from("qrshop-images").upload(path, file, { upsert:false });
  if(error){ alert("이미지 업로드 실패: " + error.message); return null; }
  const { data } = sb.storage.from("qrshop-images").getPublicUrl(path);
  return data.publicUrl;
}

async function saveProduct(id, isNew){
  const name = document.getElementById("p_name").value.trim();
  if(!name){ alert("상품명을 입력하세요."); return; }
  const payload = {
    name,
    description: document.getElementById("p_desc").value.trim(),
    price_normal: Number(document.getElementById("p_normal").value)||0,
    price_sale: Number(document.getElementById("p_sale").value)||0,
    stock: Number(document.getElementById("p_stock").value)||0,
    display_order: Number(document.getElementById("p_order").value)||0,
    is_active: document.getElementById("p_active").checked,
    image_url: document.getElementById("p_image_url").value.trim(),
    emoji: document.getElementById("p_emoji").value.trim() || "📦",
    options: [...document.querySelectorAll("[data-op]")].map(r => ({
      name: r.querySelector(".on").value.trim(),
      value: r.querySelector(".ov").value.trim(),
      additionalPrice: Number(r.querySelector(".ox").value)||0
    })).filter(x=>x.name||x.value)
  };
  const { error } = isNew
    ? await sb.from("qrshop_products").insert(payload)
    : await sb.from("qrshop_products").update(payload).eq("id", id);
  if(error){ alert("저장 실패: " + error.message); return; }
  toast("저장했습니다.");
  await loadProducts();
  renderProductsTab();
}

async function deleteProduct(id){
  const p = PRODUCTS.find(x=>x.id===id);
  if(!p) return;
  if(!confirm(`"${p.name}" 상품을 삭제할까요?`)) return;
  const { error } = await sb.from("qrshop_products").delete().eq("id", id);
  if(error){ alert("삭제 실패: " + error.message); return; }
  await loadProducts();
  renderProductsTab();
}

// ============================================================
// 결제 · 배송 설정
// ============================================================
async function loadSettings(){
  const { data, error } = await sb.from("qrshop_settings").select("*").eq("id",1).single();
  if(error){ console.error(error); toast("설정 조회 실패: " + error.message); return; }
  SETTINGS = data;
}

function renderSettingsTab(){
  const s = SETTINGS || {};
  const pm = s.payment_methods || {};
  const content = document.getElementById("tabContent");
  content.innerHTML = `
    <div class="card">
      <h3>배송비</h3>
      <div class="row2">
        <div><label class="label">기본 택배비</label><input id="st_base" type="number" class="field" value="${s.shipping_base??3500}"></div>
        <div><label class="label">무료배송 기준금액</label><input id="st_free" type="number" class="field" value="${s.shipping_free_threshold??50000}"></div>
      </div>
      <label class="label">안내 배너 문구 (비워두면 고객화면에 표시 안 함)</label>
      <input id="st_banner" class="field" value="${escAttr(s.banner_message||"")}" placeholder="예: 행사장 한정 특가, 재고 소진 시 조기 종료">
    </div>

    <div class="card">
      <h3>결제 (포트원)</h3>
      <p class="small">portone.io 콘솔의 결제연동 화면에서 발급받은 Store ID와, 결제수단별 채널 키를 입력하세요.</p>
      <label class="label">포트원 Store ID</label>
      <input id="st_store" class="field" value="${escAttr(s.portone_store_id||"")}" placeholder="store-xxxxxxxx-xxxx-...">
      ${Object.keys(PAY_META).map(m => `
        <div style="margin-top:14px;padding-top:14px;border-top:1px solid #eee">
          <label class="label"><input type="checkbox" id="pm_${m}_enabled" ${pm[m]?.enabled?"checked":""}> ${PAY_META[m].label} 사용</label>
          <input id="pm_${m}_key" class="field" style="margin-top:6px" value="${escAttr(pm[m]?.channel_key||"")}" placeholder="channel-key-xxxxxxxx-xxxx-...">
        </div>
      `).join("")}
      <div class="security-note" style="margin-top:14px">
        ⚠️ 포트원 <b>API Secret(비밀키)</b>은 여기에 입력하지 않습니다. Supabase Edge Function 환경변수로만 등록하세요 (설치_가이드.md 참고).
        여기 입력하는 Store ID·채널 키는 고객 화면에도 그대로 노출되는 "공개 식별자"라 안전합니다.
      </div>
    </div>

    <button class="black-btn" style="width:100%;border:0;border-radius:10px;padding:13px;font-weight:800" onclick="saveSettings()">설정 저장</button>
  `;
}

async function saveSettings(){
  const payment_methods = {};
  Object.keys(PAY_META).forEach(m => {
    payment_methods[m] = {
      enabled: document.getElementById(`pm_${m}_enabled`).checked,
      channel_key: document.getElementById(`pm_${m}_key`).value.trim()
    };
  });
  const payload = {
    shipping_base: Number(document.getElementById("st_base").value)||0,
    shipping_free_threshold: Number(document.getElementById("st_free").value)||0,
    banner_message: document.getElementById("st_banner").value.trim(),
    portone_store_id: document.getElementById("st_store").value.trim(),
    payment_methods,
    updated_at: new Date().toISOString()
  };
  const { error } = await sb.from("qrshop_settings").update(payload).eq("id",1);
  if(error){ alert("저장 실패: " + error.message); return; }
  toast("설정을 저장했습니다.");
  await loadSettings();
}

// ============================================================
// 주문 내역
// ============================================================
async function loadOrders(){
  const { data, error } = await sb.from("qrshop_orders").select("*, qrshop_order_items(*)").order("created_at", {ascending:false}).limit(300);
  if(error){ console.error(error); toast("주문 조회 실패: " + error.message); return; }
  ORDERS = (data||[]).map(o => ({...o, items: o.qrshop_order_items || []}));
  renderOrdersTab();
}

function renderOrdersTab(){
  const content = document.getElementById("tabContent");
  const filtered = orderFilter==="ALL" ? ORDERS : ORDERS.filter(o=>o.payment_status===orderFilter);
  content.innerHTML = `
    <div class="orders-toolbar">
      <select onchange="orderFilter=this.value; renderOrdersTab()">
        <option value="ALL" ${orderFilter==="ALL"?"selected":""}>전체 (${ORDERS.length})</option>
        <option value="PAID" ${orderFilter==="PAID"?"selected":""}>결제완료 (${ORDERS.filter(o=>o.payment_status==="PAID").length})</option>
        <option value="PENDING" ${orderFilter==="PENDING"?"selected":""}>결제대기 (${ORDERS.filter(o=>o.payment_status==="PENDING").length})</option>
        <option value="FAILED" ${orderFilter==="FAILED"?"selected":""}>실패 (${ORDERS.filter(o=>o.payment_status==="FAILED").length})</option>
      </select>
      <button onclick="loadOrders()">🔄 새로고침</button>
      <button onclick="exportOrdersCSV()">⬇ CSV 다운로드</button>
    </div>
    ${filtered.length ? filtered.map(orderCard).join("") : '<p class="small">해당하는 주문이 없습니다.</p>'}
  `;
}

function orderCard(o){
  const pillClass = o.payment_status==="PAID" ? "pill-paid" : o.payment_status==="FAILED" ? "pill-failed" : "pill-pending";
  const pillText = o.payment_status==="PAID" ? "결제완료" : o.payment_status==="FAILED" ? "결제실패" : "결제대기";
  const items = o.items || [];
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>${esc(o.order_number)}</b>
        <span class="pill ${pillClass}">${pillText}</span>
      </div>
      <div class="small" style="margin-top:4px">${new Date(o.created_at).toLocaleString("ko-KR")} · ${esc(PAY_META[o.payment_method]?.label || o.payment_method)}</div>
      <div style="margin-top:8px">${esc(o.customer_name)} · ${esc(o.customer_phone)}</div>
      <div class="small">(${esc(o.postcode||"")}) ${esc(o.address)} ${esc(o.address_extra||"")} ${esc(o.address_detail||"")}</div>
      <div class="order-items">
        ${items.map(it => `<div class="order-item-line"><span>${esc(it.product_name)}${it.option_value?` (${esc(it.option_value)})`:""} × ${it.quantity}</span><span>${won(it.subtotal)}</span></div>`).join("")}
      </div>
      <div style="display:flex;justify-content:space-between;font-weight:900;margin-top:6px">
        <span>총 결제금액</span><span>${won(o.total_amount)}</span>
      </div>
      <div class="row2" style="margin-top:12px">
        <select class="field" onchange="updateFulfillment('${o.id}', this.value)">
          ${["주문접수","배송준비","배송중","배송완료"].map(s=>`<option value="${s}" ${o.fulfillment_status===s?"selected":""}>${s}</option>`).join("")}
        </select>
        <button class="red-btn" style="border:0;border-radius:9px;font-weight:800" onclick="deleteOrderRow('${o.id}')">삭제</button>
      </div>
    </div>
  `;
}

async function updateFulfillment(orderId, status){
  const { error } = await sb.from("qrshop_orders").update({ fulfillment_status: status }).eq("id", orderId);
  if(error){ alert("상태 변경 실패: " + error.message); return; }
  toast("배송상태를 변경했습니다.");
  await loadOrders();
}

async function deleteOrderRow(orderId){
  if(!confirm("이 주문을 삭제할까요?")) return;
  const { error } = await sb.from("qrshop_orders").delete().eq("id", orderId);
  if(error){ alert("삭제 실패: " + error.message); return; }
  await loadOrders();
}

function exportOrdersCSV(){
  const rows = [["주문번호","주문일시","받는분","연락처","우편번호","주소","상세주소","상품금액","배송비","총금액","결제수단","결제상태","배송상태","상품내역"]];
  ORDERS.forEach(o=>{
    const itemsStr = (o.items||[]).map(it=>`${it.product_name}${it.option_value?`(${it.option_value})`:""} x${it.quantity}`).join(" / ");
    rows.push([o.order_number, new Date(o.created_at).toLocaleString("ko-KR"), o.customer_name, o.customer_phone, o.postcode, o.address, o.address_detail, o.product_total, o.shipping_fee, o.total_amount, PAY_META[o.payment_method]?.label||o.payment_method, o.payment_status, o.fulfillment_status, itemsStr]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `다름달음_QR주문_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
